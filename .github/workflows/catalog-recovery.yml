name: Catalog Recovery CI

on:
  pull_request:
  push:
    branches: [main, "codex/catalog-recovery-v1"]
    tags: ["catalog-recovery-v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install catalog recovery
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q catalog_recovery catalog_recovery_launcher.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: Massive-Magnetics-Catalog-Recovery-Windows
          - os: macos-latest
            artifact: Massive-Magnetics-Catalog-Recovery-macOS
          - os: ubuntu-latest
            artifact: Massive-Magnetics-Catalog-Recovery-Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install . "pyinstaller>=6.10,<7"
      - name: Build local desktop executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Massive-Magnetics-Catalog-Recovery
          catalog_recovery_launcher.py
      - name: Smoke-test packaged runtime
        run: python tools/smoke_desktop_release.py --input dist
      - name: Package release asset
        run: >-
          python tools/package_catalog_release.py
          --input dist
          --output ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/catalog-recovery-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*.zip
          release-assets/SHA256SUMS.txt
          --verify-tag
          --title "Massive Magnetics Catalog Recovery ${GITHUB_REF_NAME#catalog-recovery-v}"
          --notes-file catalog_recovery/RELEASE_NOTES.md
